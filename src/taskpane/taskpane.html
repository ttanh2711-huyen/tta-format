<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TTA-Format</title>
    <%= officeScript %>
    <style>
<%= styles %>
    </style>
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <div class="brand">
          <span class="logo" aria-hidden="true">TTA</span>
          <div>
            <h1>TTA-Format</h1>
            <p class="tagline">Soạn và chuẩn hoá văn bản hành chính</p>
          </div>
        </div>
        <span id="app-version" class="chip"></span>
      </header>
      <div class="tab-bar"><div id="tabs"></div></div>
      <div id="notice" class="notice"></div>
      <p id="status" role="status" aria-live="polite">Đang khởi động…</p>
      <main>
        <div id="panel-standard" role="tabpanel"></div>
        <div id="panel-check" role="tabpanel" hidden></div>
        <div id="panel-agency" role="tabpanel" hidden></div>
      </main>
    </div>
  </body>
</html>
