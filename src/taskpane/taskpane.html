<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NĐ 30</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <style>
      body {
        font-family: "Segoe UI", sans-serif;
        font-size: 14px;
        margin: 0;
        padding: 12px;
        color: #222;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 8px;
      }
      button {
        font: inherit;
        padding: 6px 12px;
        cursor: pointer;
      }
      #status {
        margin-top: 12px;
        color: #555;
      }
      #page-setup-panel {
        margin-top: 16px;
        border-top: 1px solid #ccc;
        padding-top: 8px;
      }
      #standard-switcher fieldset {
        border: 1px solid #ccc;
        margin: 0 0 6px;
        padding: 4px 8px;
      }
      #standard-switcher label {
        display: block;
        margin: 4px 0;
      }
      #standard-switcher .ss-box {
        background: #fff4d6;
        border: 1px solid #d9a400;
        padding: 4px 8px;
        margin: 4px 0;
      }
      #standard-switcher .ss-box button {
        margin: 2px 4px 2px 0;
      }
      #ss-message.ok {
        color: #1a6b1a;
      }
      #ss-message.warning {
        color: #8a5a00;
      }
      #ss-message.error {
        color: #a00000;
      }
      #fix-all {
        margin: 8px 0;
      }
      #fa-main {
        background: #1f6feb;
        color: #fff;
        border: none;
        font-weight: 600;
        padding: 10px 18px;
      }
      #fa-main:disabled {
        background: #9bbcf0;
      }
      #fix-all .fa-box {
        background: #eef4ff;
        border: 1px solid #1f6feb;
        padding: 6px 10px;
        margin: 6px 0;
      }
      #fix-all .fa-box button {
        margin: 2px 4px 2px 0;
      }
      #fix-all .fa-box ul {
        padding-left: 18px;
        margin: 6px 0;
      }
      #fix-all .fa-skip {
        color: #777;
      }
      #fix-all .note {
        color: #777;
      }
      #fa-message.ok {
        color: #1a6b1a;
      }
      #fa-message.warning {
        color: #8a5a00;
      }
      #fa-message.error {
        color: #a00000;
      }
      #report {
        margin-top: 16px;
        border-top: 1px solid #ccc;
        padding-top: 8px;
      }
      #report h2 {
        font-size: 14px;
        margin: 0 0 6px;
      }
      #report ol {
        padding-left: 20px;
      }
      #report li {
        margin: 6px 0;
      }
      #report li.error strong {
        color: #a00000;
      }
      #report li.warning strong {
        color: #8a5a00;
      }
      #report .note {
        color: #777;
      }
      #rp-summary.ok {
        color: #1a6b1a;
      }
      #rp-summary.warning {
        color: #8a5a00;
      }
      #rp-summary.error {
        color: #a00000;
      }
      #new-doc {
        margin-top: 16px;
        border-top: 1px solid #ccc;
        padding-top: 8px;
      }
      #new-doc h2 {
        font-size: 14px;
        margin: 0 0 6px;
      }
      #nw-create {
        background: #1a6b1a;
        color: #fff;
        border: none;
        font-weight: 600;
        padding: 8px 16px;
      }
      #new-doc .nw-box {
        background: #fff4d6;
        border: 1px solid #d9a400;
        padding: 4px 8px;
        margin: 4px 0;
      }
      #new-doc .nw-box button {
        margin: 2px 4px 2px 0;
      }
      #new-doc .note {
        color: #777;
      }
      #nw-message.ok {
        color: #1a6b1a;
      }
      #nw-message.warning {
        color: #8a5a00;
      }
      #nw-message.error {
        color: #a00000;
      }
      #header-form {
        margin-top: 16px;
        border-top: 1px solid #ccc;
        padding-top: 8px;
      }
      #header-form h2 {
        font-size: 14px;
        margin: 0 0 6px;
      }
      #header-form textarea {
        width: 95%;
      }
      #header-form input[type="text"] {
        width: 95%;
        margin: 2px 0;
      }
      #header-form button {
        margin: 2px 4px 2px 0;
      }
      #header-form .hf-box {
        background: #fff4d6;
        border: 1px solid #d9a400;
        padding: 4px 8px;
        margin: 4px 0;
      }
      #header-form .note {
        color: #777;
      }
      #hf-message.ok {
        color: #1a6b1a;
      }
      #hf-message.warning {
        color: #8a5a00;
      }
      #hf-message.error {
        color: #a00000;
      }
      #footer-form {
        margin-top: 16px;
        border-top: 1px solid #ccc;
        padding-top: 8px;
      }
      #footer-form h2 {
        font-size: 14px;
        margin: 0 0 6px;
      }
      #footer-form input[type="text"],
      #footer-form textarea {
        width: 95%;
        margin: 2px 0;
      }
      #footer-form fieldset {
        border: 1px solid #ccc;
        margin: 4px 0;
        padding: 4px 8px;
      }
      #footer-form button {
        margin: 2px 4px 2px 0;
      }
      #footer-form .ff-box {
        background: #fff4d6;
        border: 1px solid #d9a400;
        padding: 4px 8px;
        margin: 4px 0;
      }
      #footer-form .note {
        color: #777;
      }
      #ff-message.ok {
        color: #1a6b1a;
      }
      #ff-message.warning {
        color: #8a5a00;
      }
      #ff-message.error {
        color: #a00000;
      }
      #quick-options {
        margin-top: 16px;
        border-top: 1px solid #ccc;
        padding-top: 8px;
      }
      #quick-options h2 {
        font-size: 14px;
        margin: 0 0 6px;
      }
      #quick-options details {
        border: 1px solid #ccc;
        margin: 4px 0;
        padding: 4px 8px;
      }
      #quick-options summary {
        cursor: pointer;
        font-weight: 600;
      }
      #quick-options .qo-row {
        margin: 8px 0;
        padding-bottom: 6px;
        border-bottom: 1px dotted #ddd;
      }
      #quick-options .qo-choices button,
      #quick-options .qo-toolbar button {
        margin: 2px 4px 2px 0;
        padding: 3px 8px;
      }
      #quick-options button[aria-pressed="true"] {
        background: #cfe3ff;
        border: 1px solid #2b6cb0;
      }
      #quick-options .qo-small {
        padding: 2px 6px;
        font-size: 12px;
      }
      #quick-options .qo-custom input[type="text"] {
        width: 70px;
      }
      #quick-options .qo-exception {
        color: #8a5a00;
      }
      #quick-options .qo-confirm {
        background: #fff4d6;
        border: 1px solid #d9a400;
        padding: 4px 8px;
        margin-top: 4px;
      }
      #quick-options .note {
        color: #777;
      }
      #qo-message.ok {
        color: #1a6b1a;
      }
      #qo-message.warning {
        color: #8a5a00;
      }
      #qo-message.error {
        color: #a00000;
      }
      #format-panel {
        margin-top: 16px;
        border-top: 1px solid #ccc;
        padding-top: 8px;
      }
      #format-panel h2 {
        font-size: 14px;
        margin: 0 0 6px;
      }
      #format-panel label {
        display: block;
        margin: 4px 0;
      }
      #format-panel fieldset {
        border: 1px solid #ccc;
        margin: 0 0 6px;
        padding: 4px 8px;
      }
      #format-panel .note {
        color: #777;
      }
      #fb-message.ok {
        color: #1a6b1a;
      }
      #fb-message.warning {
        color: #8a5a00;
      }
      #fb-message.error {
        color: #a00000;
      }
      #page-setup-panel h2 {
        font-size: 14px;
        margin: 0 0 6px;
      }
      #page-setup-panel label {
        display: block;
        margin: 4px 0;
      }
      #page-setup-panel input[type="text"] {
        width: 60px;
      }
      #page-setup-panel fieldset {
        border: 1px solid #ccc;
        margin: 0 0 6px;
        padding: 4px 8px;
      }
      #page-setup-panel .note {
        color: #777;
      }
      #ps-style-message.ok,
      #ps-number-message.ok,
      #ps-message.ok {
        color: #1a6b1a;
      }
      #ps-style-message.warning,
      #ps-number-message.warning,
      #ps-message.warning {
        color: #8a5a00;
      }
      #ps-style-message.error,
      #ps-number-message.error,
      #ps-message.error {
        color: #a00000;
      }
    </style>
  </head>
  <body>
    <h1>Định dạng văn bản</h1>
    <section id="standard-switcher"></section>
    <section id="fix-all"></section>
    <button id="btn-sample" type="button">Chèn văn bản thử nghiệm</button>
    <p><a href="spike.html">Kiểm tra khả thi Office.js (T3)</a></p>
    <p id="status" role="status" aria-live="polite">Đang khởi động…</p>
    <section id="report"></section>
    <section id="new-doc"></section>
    <section id="header-form"></section>
    <section id="footer-form"></section>
    <section id="quick-options"></section>
    <section id="page-setup-panel"></section>
    <section id="format-panel"></section>
  </body>
</html>
